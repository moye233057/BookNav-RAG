# conda 环境定义。conda 只负责解释器（与 README 一致的 Python 3.12.14），
# Python 包仍由 requirements.txt 作唯一来源，避免两份依赖表漂移。
#
# 用法（本机已验证过的形式见 README「启动方式」）：
#   conda env create -f environment.yml
#   conda activate rag
#   pip install -r requirements.txt

name: rag

channels:
  - defaults

dependencies:
  - python=3.12.14
  - pip
