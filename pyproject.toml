# 安装元数据。只为「源码留在仓库树里」这一件事服务，见 README「启动方式」的两个长驻入口。
#
# 为什么必须 editable：conf/base.py 用 __file__ 推算 ROOT，conf/__init__.py 又用
# ROOT / config.yaml 的相对目录去找 .env 与 data/、models/。装成普通 wheel 会把包复制到
# site-packages，ROOT 就落到 site-packages 上，仓库外的 .env 与相对数据目录全部找不到。
# 所以：pip install -e . ，且不提供 [project.scripts] 控制台入口。
# 也不要把它当可从 PyPI 安装的库：版本号只用于本地元数据。

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "book-nav-rag"
version = "0.1.0"
description = "BookNav-RAG 目录导航问答：印刷目录归页 + 在线检索；个人学习与展示，非商业生产"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# 唯一来源是 requirements.txt，逐行照抄（含 == 钉法）。改依赖先改 requirements.txt。
# 注释与 requirements.txt 的分层说明保持一致；版本只钉本仓代码直接 import 的包，不列传递依赖。
dependencies = [
    # 离线抽取层
    "pymupdf4llm==1.28.2",

    # 在线服务
    "fastapi==0.141.1",
    "uvicorn==0.53.0",

    # 在线编排与生成
    "langgraph==1.2.11",
    "langchain-openai==1.6.0",

    # 向量层与召回
    "lancedb==0.37.1",
    "pylance==12.0.0",

    # HTTP 客户端：调本仓向量服务 8030（KV 实验脚本另用它打外仓 /extract）
    "requests==2.34.2",

    # 向量模型服务 embed/ 与 scripts/download_embed.py 用；缺这三个 embed_server.py 起不来
    "torch==2.14.0",
    "sentence-transformers==6.0.1",
    "transformers==5.17.0",
    "modelscope==1.40.1",
]

[project.optional-dependencies]
# requirements.txt 不装 pytest，但 tests/ 要用。
dev = ["pytest"]

[tool.setuptools]
# flat-layout 自动发现在本仓会因多个顶层包/目录直接报错，所以显式限定，不做全自动发现。
# ask_server.py / embed_server.py 是仓库根的入口模块；web/、data/、models/ 不是 Python 包，
# scripts/ 与 tests/ 是调试与用例，不是被 import 的库。
py-modules = ["ask_server", "embed_server"]

[tool.setuptools.packages.find]
# 用 find 而不是手写包名：本仓按层加目录（offline/extract/methods 这种），新增包不用回来改这里。
# 四个前缀覆盖 conf/、offline/、online/、embed/ 及其全部子包。
include = ["conf*", "offline*", "online*", "embed*"]
